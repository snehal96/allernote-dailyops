<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d">
  <title id="t">AllerNote DailyOps</title>
  <desc id="d">A self-running ops agent for a live product, built and run by one person. The loop: sense, plan, act, learn.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .pill { fill: none; stroke: #5E8A69; stroke-width: 1.2; }
    .pt { font-size: 13px; fill: #D5E0D3; }
    .node { fill: #2E4A37; stroke: #7FA88A; stroke-width: 1.2; }
    .nt { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #F7F4EC; }
    .ring { fill: none; stroke: #5E8A69; stroke-width: 1.5; stroke-dasharray: 4 6; animation: r 30s linear infinite; }
    @keyframes r { to { stroke-dashoffset: -200; } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  </style>
  <rect width="1000" height="260" rx="18" fill="#22382A"/>
  <text x="48" y="62" class="m" font-size="14" fill="#A9C3AE">snehal96 / allernote-dailyops</text>
  <text x="48" y="118" font-size="48" font-weight="700" fill="#F7F4EC">AllerNote DailyOps</text>
  <text x="48" y="154" font-size="18" fill="#D5E0D3">A self-running ops agent for a live product.</text>
  <text x="48" y="178" font-size="18" fill="#D5E0D3">Built and run by one person.</text>

  <rect x="48" y="200" width="125" height="30" rx="15" class="pill"/>
  <text x="110.5" y="220" text-anchor="middle" class="m pt">11 collectors</text>
  <rect x="181" y="200" width="125" height="30" rx="15" class="pill"/>
  <text x="243.5" y="220" text-anchor="middle" class="m pt">4 agent roles</text>
  <rect x="314" y="200" width="94" height="30" rx="15" class="pill"/>
  <text x="361" y="220" text-anchor="middle" class="m pt">151 tests</text>
  <rect x="416" y="200" width="172" height="30" rx="15" class="pill"/>
  <text x="502" y="220" text-anchor="middle" class="m pt">live since Jul 2026</text>

  <circle cx="820" cy="135" r="78" class="ring"/>
  <circle cx="820" cy="57" r="6" fill="#E8B04A">
    <animateTransform attributeName="transform" type="rotate" from="0 820 135" to="360 820 135" dur="10s" repeatCount="indefinite"/>
  </circle>
  <text x="820" y="131" text-anchor="middle" class="m" font-size="13" fill="#A9C3AE">every</text>
  <text x="820" y="149" text-anchor="middle" class="m" font-size="13" fill="#A9C3AE">morning</text>

  <rect x="785" y="44" width="70" height="26" rx="13" class="node"/>
  <text x="820" y="61.5" text-anchor="middle" class="nt">SENSE</text>
  <rect x="863" y="122" width="70" height="26" rx="13" class="node"/>
  <text x="898" y="139.5" text-anchor="middle" class="nt">PLAN</text>
  <rect x="785" y="200" width="70" height="26" rx="13" class="node"/>
  <text x="820" y="217.5" text-anchor="middle" class="nt">ACT</text>
  <rect x="707" y="122" width="70" height="26" rx="13" class="node"/>
  <text x="742" y="139.5" text-anchor="middle" class="nt">LEARN</text>
</svg>
