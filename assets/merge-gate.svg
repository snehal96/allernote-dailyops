<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="t d">
  <title id="t">When can an agent change ship by itself?</title>
  <desc id="d">A decision path. Diffs touching billing, auth, schema, payments, migrations or dependency manifests are blocked. Failing verify commands stop the task. Approved PRD slices merge to staging. Small Tier 1 changes merge to main and the watchdog reverts them if live URLs fail. Everything else becomes a branch for review.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A8A7E"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2A22; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13.5px; fill: #5F6B62; }
    .h { font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    .b { font-size: 15px; }
    .s { font-size: 13px; fill: #5F6B62; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #5F6B62; }
    .q { fill: #FFFFFF; stroke: #D9D2C1; stroke-width: 1.5; }
    .ln { stroke: #7A8A7E; stroke-width: 2; fill: none; }
  </style>
  <rect width="1000" height="660" rx="18" fill="#F7F4EC"/>
  <text x="40" y="52" class="title">When can an agent change ship by itself?</text>
  <text x="40" y="76" class="sub">lib/agent_git.py. These checks run as code against the real diff. None of them is an instruction in a prompt.</text>

  <rect x="40" y="96" width="520" height="40" rx="20" fill="#1F2A22"/>
  <text x="300" y="121" text-anchor="middle" class="b" style="fill:#F7F4EC">Executor commits inside its own git worktree</text>
  <line x1="300" y1="136" x2="300" y2="155" class="ln" marker-end="url(#a)"/>

  <!-- Q1 -->
  <rect x="40" y="160" width="520" height="64" rx="12" class="q"/>
  <text x="60" y="187" class="b">Does the diff touch billing, auth, schema, payments,</text>
  <text x="60" y="209" class="b">a migration or a dependency manifest?</text>
  <line x1="560" y1="192" x2="614" y2="192" class="ln" marker-end="url(#a)"/>
  <text x="575" y="184" class="lbl">yes</text>
  <rect x="620" y="160" width="340" height="64" rx="12" fill="#F8E5E1" stroke="#A8463A" stroke-width="1.5"/>
  <text x="640" y="186" class="h" style="fill:#A8463A">BLOCKED</text>
  <text x="640" y="208" class="b">never automated, founder only</text>
  <line x1="300" y1="224" x2="300" y2="259" class="ln" marker-end="url(#a)"/>
  <text x="312" y="246" class="lbl">no</text>

  <!-- Q2 -->
  <rect x="40" y="264" width="520" height="64" rx="12" class="q"/>
  <text x="60" y="291" class="b">Do the repo's verify commands pass?</text>
  <text x="60" y="313" class="s">Exit codes from real runs. The model saying "tests pass" counts for nothing.</text>
  <line x1="560" y1="296" x2="614" y2="296" class="ln" marker-end="url(#a)"/>
  <text x="575" y="288" class="lbl">no</text>
  <rect x="620" y="264" width="340" height="64" rx="12" fill="#F8E5E1" stroke="#A8463A" stroke-width="1.5"/>
  <text x="640" y="290" class="h" style="fill:#A8463A">STOP</text>
  <text x="640" y="312" class="b">the failure goes into the report</text>
  <line x1="300" y1="328" x2="300" y2="363" class="ln" marker-end="url(#a)"/>
  <text x="312" y="350" class="lbl">yes</text>

  <!-- Q3 -->
  <rect x="40" y="368" width="520" height="64" rx="12" class="q"/>
  <text x="60" y="405" class="b">Is it a slice of a PRD you approved?</text>
  <line x1="560" y1="400" x2="614" y2="400" class="ln" marker-end="url(#a)"/>
  <text x="575" y="392" class="lbl">yes</text>
  <rect x="620" y="368" width="340" height="64" rx="12" fill="#FFFFFF" stroke="#3E6B4C" stroke-width="1.5"/>
  <text x="640" y="394" class="h" style="fill:#3E6B4C">MERGE TO STAGING</text>
  <text x="640" y="416" class="b">you click through it, then promote</text>
  <line x1="300" y1="432" x2="300" y2="467" class="ln" marker-end="url(#a)"/>
  <text x="312" y="454" class="lbl">no</text>

  <!-- Q4 -->
  <rect x="40" y="472" width="520" height="64" rx="12" class="q"/>
  <text x="60" y="499" class="b">Tier 1 class: content, SEO, copy, data, instrumentation?</text>
  <text x="60" y="521" class="b">And under 25 files and 600 changed lines?</text>
  <line x1="560" y1="504" x2="614" y2="504" class="ln" marker-end="url(#a)"/>
  <text x="575" y="496" class="lbl">no</text>
  <rect x="620" y="472" width="340" height="64" rx="12" fill="#FBF1DE" stroke="#B7791F" stroke-width="1.5"/>
  <text x="640" y="498" class="h" style="fill:#8A5A12">PUSH A BRANCH</text>
  <text x="640" y="520" class="b">you review it and open the PR</text>
  <line x1="300" y1="536" x2="300" y2="571" class="ln" marker-end="url(#a)"/>
  <text x="312" y="558" class="lbl">yes</text>

  <!-- final -->
  <rect x="40" y="576" width="520" height="56" rx="12" fill="#3E6B4C"/>
  <text x="60" y="600" class="h" style="fill:#CFE0CC">MERGE TO MAIN</text>
  <text x="60" y="621" class="b" style="fill:#FFFFFF">the deploy webhook rebuilds the service</text>
  <line x1="560" y1="604" x2="614" y2="604" class="ln" marker-end="url(#a)"/>
  <rect x="620" y="576" width="340" height="56" rx="12" fill="#E2ECDF" stroke="#3E6B4C" stroke-width="1.5"/>
  <text x="640" y="600" class="h" style="fill:#3E6B4C">WATCHDOG · EVERY 5 MIN</text>
  <text x="640" y="621" class="b">reverts the merge if live URLs fail</text>
</svg>
